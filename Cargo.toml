[package]
name = "easydesktop"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
eframe = "0.34"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.8"
winreg = "0.52"
